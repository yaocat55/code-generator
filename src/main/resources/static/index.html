<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Generator - SQL to CRUD</title>
    <style>
        :root {
            --bg: #f0f2f5;
            --card-bg: #ffffff;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-light: #eef2ff;
            --text: #1e293b;
            --text-secondary: #64748b;
            --border: #e2e8f0;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --radius: 12px;
            --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.06), 0 1px 2px -1px rgb(0 0 0 / 0.06);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.08), 0 4px 6px -4px rgb(0 0 0 / 0.04);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* Header */
        .header {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 0 24px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow);
        }
        .header-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 18px;
            font-weight: 700;
            color: var(--primary);
        }
        .header-logo .icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--primary), #818cf8);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 16px;
        }
        .header-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .badge {
            font-size: 12px;
            padding: 2px 10px;
            border-radius: 100px;
            background: var(--primary-light);
            color: var(--primary);
            font-weight: 500;
        }

        /* Main Layout */
        .main-container {
            display: flex;
            gap: 20px;
            padding: 20px 24px;
            max-width: 1500px;
            margin: 0 auto;
            min-height: calc(100vh - 56px);
        }
        .panel {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 24px;
        }
        .panel-left {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .panel-right {
            width: 500px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .panel-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .panel-title .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--primary);
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 0;
            border-bottom: 2px solid var(--border);
            margin-bottom: 16px;
        }
        .tab {
            padding: 8px 16px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            transition: all 0.2s;
            background: none;
            border-top: none;
            border-left: none;
            border-right: none;
        }
        .tab:hover { color: var(--text); }
        .tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        /* Upload Zone */
        .upload-zone {
            border: 2px dashed var(--border);
            border-radius: var(--radius);
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: #fafbfc;
        }
        .upload-zone:hover, .upload-zone.drag-over {
            border-color: var(--primary);
            background: var(--primary-light);
        }
        .upload-zone .upload-icon {
            font-size: 40px;
            margin-bottom: 12px;
        }
        .upload-zone .upload-text {
            font-size: 14px;
            color: var(--text-secondary);
        }
        .upload-zone .upload-hint {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 8px;
        }
        .upload-zone input[type="file"] { display: none; }

        /* SQL Textarea */
        .sql-editor {
            width: 100%;
            min-height: 320px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
            font-size: 13px;
            line-height: 1.6;
            resize: vertical;
            background: #1e1e2e;
            color: #cdd6f4;
            tab-size: 4;
        }
        .sql-editor:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        /* Buttons */
        .btn {
            padding: 8px 18px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        .btn-primary {
            background: var(--primary);
            color: white;
        }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn-outline {
            background: white;
            border-color: var(--border);
            color: var(--text);
        }
        .btn-outline:hover { background: #f8fafc; }
        .btn-success {
            background: var(--success);
            color: white;
        }
        .btn-success:hover { background: #059669; }
        .btn-sm {
            padding: 4px 12px;
            font-size: 12px;
            border-radius: 6px;
        }

        /* Form */
        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }
        .form-input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        /* Checkbox group */
        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 13px;
            cursor: pointer;
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid var(--border);
            transition: all 0.2s;
            user-select: none;
        }
        .checkbox-item:hover { border-color: var(--primary); }
        .checkbox-item.checked {
            background: var(--primary-light);
            border-color: var(--primary);
            color: var(--primary);
        }
        .checkbox-item input { display: none; }

        /* Table Preview */
        .table-preview {
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            max-height: 400px;
        }
        .table-preview-header {
            background: #f8fafc;
            padding: 10px 16px;
            font-size: 13px;
            font-weight: 600;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .table-preview-body {
            overflow-y: auto;
            max-height: 340px;
        }
        .table-item {
            border-bottom: 1px solid var(--border);
        }
        .table-item:last-child { border-bottom: none; }
        .table-item-header {
            padding: 10px 16px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.15s;
        }
        .table-item-header:hover { background: #f8fafc; }
        .table-item-header .table-name {
            color: var(--primary);
            font-family: 'JetBrains Mono', monospace;
        }
        .table-item-header .table-comment {
            color: var(--text-secondary);
            font-size: 12px;
        }
        .table-columns {
            display: none;
            padding: 8px 16px 12px;
            background: #fafbfc;
        }
        .table-columns.open { display: block; }
        .column-row {
            display: flex;
            gap: 8px;
            padding: 3px 0;
            font-size: 12px;
            font-family: 'JetBrains Mono', monospace;
        }
        .column-row .col-name { color: var(--text); font-weight: 500; min-width: 140px; }
        .column-row .col-type { color: var(--primary); min-width: 90px; }
        .column-row .col-comment { color: var(--text-secondary); flex: 1; }
        .column-row .col-java { color: #f59e0b; }

        /* Toast */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .toast {
            padding: 12px 20px;
            border-radius: 8px;
            color: white;
            font-size: 14px;
            font-weight: 500;
            box-shadow: var(--shadow-lg);
            animation: slideIn 0.3s ease;
            max-width: 420px;
        }
        .toast.success { background: var(--success); }
        .toast.error { background: var(--danger); }
        .toast.info { background: var(--primary); }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* Template manager */
        .template-manager {
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
        }
        .template-manager-header {
            background: #f8fafc;
            padding: 10px 16px;
            font-size: 13px;
            font-weight: 600;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }
        .template-manager-body {
            display: none;
        }
        .template-manager-body.open { display: block; }
        .template-list {
            max-height: 200px;
            overflow-y: auto;
        }
        .template-list-item {
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: background 0.15s;
        }
        .template-list-item:hover { background: #f8fafc; }
        .template-list-item.active { background: var(--primary-light); }
        .template-editor {
            border-top: 1px solid var(--border);
        }
        .template-editor textarea {
            width: 100%;
            min-height: 260px;
            border: none;
            padding: 16px;
            font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
            font-size: 13px;
            line-height: 1.6;
            resize: vertical;
            background: #1e1e2e;
            color: #cdd6f4;
        }
        .template-editor textarea:focus { outline: none; }
        .template-editor-actions {
            padding: 10px 16px;
            display: flex;
            gap: 8px;
            background: #f8fafc;
            border-top: 1px solid var(--border);
        }

        /* Loading spinner */
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .empty-state {
            text-align: center;
            padding: 30px;
            color: var(--text-secondary);
            font-size: 14px;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        @media (max-width: 900px) {
            .main-container { flex-direction: column; padding: 12px; }
            .panel-right { width: 100%; }
        }
    </style>
</head>
<body>

<header class="header">
    <div class="header-logo">
        <div class="icon">{ }</div>
        <span>Code Generator</span>
    </div>
    <div class="header-actions">
        <span class="badge">JDK 17</span>
        <span class="badge">Spring Boot 2.7</span>
    </div>
</header>

<div class="main-container">
    <!-- Left Panel: SQL Input -->
    <div class="panel panel-left">
        <div class="tabs">
            <button class="tab active" data-tab="upload">Upload SQL File</button>
            <button class="tab" data-tab="paste">Paste SQL</button>
        </div>

        <!-- Upload Tab -->
        <div id="tab-upload" class="tab-content">
            <div class="upload-zone" id="uploadZone">
                <div class="upload-icon">&#128196;</div>
                <div class="upload-text">Drag & drop a <strong>.sql</strong> file here</div>
                <div class="upload-hint">or click to browse — supports CREATE TABLE statements</div>
                <input type="file" id="fileInput" accept=".sql,.txt">
            </div>
            <div id="fileInfo" style="margin-top:12px;font-size:13px;color:var(--text-secondary);display:none;"></div>
        </div>

        <!-- Paste Tab -->
        <div id="tab-paste" class="tab-content" style="display:none;">
            <textarea class="sql-editor" id="sqlEditor" placeholder="Paste your CREATE TABLE SQL here...

Example:
CREATE TABLE `user` (
  `id` bigint NOT NULL AUTO_INCREMENT COMMENT 'User ID',
  `username` varchar(50) NOT NULL COMMENT 'Username',
  `email` varchar(100) DEFAULT NULL COMMENT 'Email',
  `create_time` datetime DEFAULT CURRENT_TIMESTAMP COMMENT 'Create Time',
  PRIMARY KEY (`id`)
) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COMMENT='User Table';"></textarea>
        </div>

        <div style="display:flex;gap:8px;">
            <button class="btn btn-primary" id="btnParse" onclick="parseSql()">
                Parse SQL
            </button>
            <button class="btn btn-outline" onclick="clearAll()">Clear</button>
        </div>
    </div>

    <!-- Right Panel: Config & Preview -->
    <div class="panel panel-right">
        <!-- Configuration -->
        <div>
            <div class="panel-title"><span class="dot"></span>Generation Config</div>
            <div class="form-group">
                <label>Author</label>
                <input class="form-input" id="author" value="sue" placeholder="Author name">
            </div>
            <div class="form-group">
                <label>Package Name</label>
                <input class="form-input" id="packageName" value="com.example" placeholder="e.g. com.example.demo">
            </div>
            <div class="form-group">
                <label>Code Types</label>
                <div class="checkbox-group" id="codeTypes">
                    <label class="checkbox-item checked" data-value="entity">Entity</label>
                    <label class="checkbox-item checked" data-value="mapper">Mapper</label>
                    <label class="checkbox-item checked" data-value="xml">XML</label>
                    <label class="checkbox-item checked" data-value="service">Service</label>
                    <label class="checkbox-item checked" data-value="controller">Controller</label>
                    <label class="checkbox-item" data-value="vue">Vue</label>
                    <label class="checkbox-item" data-value="react">React</label>
                    <label class="checkbox-item" data-value="test">Test</label>
                </div>
            </div>
            <button class="btn btn-success" id="btnGenerate" onclick="generateCode()" disabled style="width:100%;justify-content:center;">
                Generate & Download ZIP
            </button>
        </div>

        <!-- Table Preview -->
        <div>
            <div class="panel-title"><span class="dot"></span>Parsed Tables <span id="tableCount" style="font-size:12px;color:var(--text-secondary);font-weight:400;"></span></div>
            <div class="table-preview">
                <div class="table-preview-body" id="tablePreview">
                    <div class="empty-state">Parse SQL to see table structure</div>
                </div>
            </div>
        </div>

        <!-- Template Manager -->
        <div class="template-manager">
            <div class="template-manager-header" onclick="toggleTemplateManager()">
                <span>Template Manager</span>
                <span id="tmToggle" style="font-size:12px;">&#9654;</span>
            </div>
            <div class="template-manager-body" id="tmBody">
                <div class="template-list" id="templateList">
                    <div class="empty-state">Loading templates...</div>
                </div>
                <div class="template-editor" id="templateEditor" style="display:none;">
                    <textarea id="templateContent" placeholder="Template content..."></textarea>
                    <div class="template-editor-actions">
                        <button class="btn btn-primary btn-sm" onclick="saveTemplate()">Save</button>
                        <button class="btn btn-outline btn-sm" onclick="validateTemplate()">Validate</button>
                        <button class="btn btn-outline btn-sm" onclick="restoreTemplates()">Restore Defaults</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
// ===== State =====
let parsedTables = [];
let parsedSql = '';
let currentTemplate = null;

// ===== Tab Switching =====
document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        const target = tab.dataset.tab;
        document.getElementById('tab-upload').style.display = target === 'upload' ? 'block' : 'none';
        document.getElementById('tab-paste').style.display = target === 'paste' ? 'block' : 'none';
    });
});

// ===== File Upload =====
const uploadZone = document.getElementById('uploadZone');
const fileInput = document.getElementById('fileInput');
const fileInfo = document.getElementById('fileInfo');

uploadZone.addEventListener('click', () => fileInput.click());
uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('drag-over'); });
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag-over'));
uploadZone.addEventListener('drop', e => {
    e.preventDefault();
    uploadZone.classList.remove('drag-over');
    const file = e.dataTransfer.files[0];
    if (file) handleFile(file);
});
fileInput.addEventListener('change', () => {
    const file = fileInput.files[0];
    if (file) handleFile(file);
});

function handleFile(file) {
    if (!file.name.endsWith('.sql') && !file.name.endsWith('.txt')) {
        showToast('Please upload a .sql or .txt file', 'error');
        return;
    }
    const reader = new FileReader();
    reader.onload = e => {
        parsedSql = e.target.result;
        document.getElementById('sqlEditor').value = parsedSql;
        fileInfo.style.display = 'block';
        fileInfo.innerHTML = `File loaded: <strong>${file.name}</strong> (${(file.size / 1024).toFixed(1)} KB)`;
        showToast('File loaded: ' + file.name, 'success');
        parseSql();
    };
    reader.readAsText(file);
}

// ===== Checkbox Group =====
document.querySelectorAll('.checkbox-item').forEach(item => {
    item.addEventListener('click', () => {
        item.classList.toggle('checked');
    });
});

// ===== Template Manager =====
function toggleTemplateManager() {
    const body = document.getElementById('tmBody');
    const toggle = document.getElementById('tmToggle');
    const isOpen = body.classList.toggle('open');
    toggle.innerHTML = isOpen ? '&#9660;' : '&#9654;';
    if (isOpen) loadTemplateList();
}

async function loadTemplateList() {
    try {
        const res = await fetch('/api/gen/templates');
        const data = await res.json();
        const list = document.getElementById('templateList');
        if (data.success && data.data) {
            list.innerHTML = data.data.map(name =>
                `<div class="template-list-item" onclick="selectTemplate('${name}')">${name}</div>`
            ).join('');
        }
    } catch (e) {
        list.innerHTML = '<div class="empty-state">Failed to load templates</div>';
    }
}

async function selectTemplate(name) {
    currentTemplate = name;
    document.querySelectorAll('.template-list-item').forEach(el => el.classList.remove('active'));
    event.target.classList.add('active');

    try {
        const res = await fetch(`/api/gen/template?name=${encodeURIComponent(name)}`);
        const data = await res.json();
        if (data.success) {
            document.getElementById('templateEditor').style.display = 'block';
            document.getElementById('templateContent').value = data.data.content;
        }
    } catch (e) {
        showToast('Failed to load template', 'error');
    }
}

async function saveTemplate() {
    if (!currentTemplate) return showToast('Select a template first', 'error');
    const content = document.getElementById('templateContent').value;
    try {
        const res = await fetch('/api/gen/template', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ templateName: currentTemplate, content })
        });
        const data = await res.json();
        showToast(data.message || 'Saved', data.success ? 'success' : 'error');
    } catch (e) {
        showToast('Save failed', 'error');
    }
}

async function validateTemplate() {
    if (!currentTemplate) return showToast('Select a template first', 'error');
    const content = document.getElementById('templateContent').value;
    try {
        const res = await fetch('/api/gen/template/validate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ templateName: currentTemplate, content })
        });
        const data = await res.json();
        showToast(data.message, data.success ? 'success' : 'error');
    } catch (e) {
        showToast('Validation failed', 'error');
    }
}

function restoreTemplates() {
    if (!confirm('Backup and delete all custom templates? A ZIP backup will be downloaded.')) return;
    const a = document.createElement('a');
    a.href = '/api/gen/templates/restore';
    a.download = '';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    showToast('Restored default templates', 'success');
}

// ===== Parse SQL =====
async function parseSql() {
    const sql = document.getElementById('sqlEditor').value.trim() || parsedSql;
    if (!sql) {
        document.getElementById('sqlEditor').value && (parsedSql = document.getElementById('sqlEditor').value);
        if (!parsedSql) return showToast('Please upload a SQL file or paste SQL', 'error');
    }
    parsedSql = sql;
    document.getElementById('sqlEditor').value = sql;

    try {
        const res = await fetch('/api/gen/parse', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sql })
        });
        const data = await res.json();
        if (data.success) {
            parsedTables = data.data;
            renderTablePreview(parsedTables);
            document.getElementById('tableCount').textContent = `(${parsedTables.length} table(s))`;
            document.getElementById('btnGenerate').disabled = false;
            showToast(data.message, 'success');
        } else {
            showToast(data.message, 'error');
        }
    } catch (e) {
        showToast('Parse failed: ' + e.message, 'error');
    }
}

// ===== Render Table Preview =====
function renderTablePreview(tables) {
    const container = document.getElementById('tablePreview');
    if (!tables || tables.length === 0) {
        container.innerHTML = '<div class="empty-state">No tables parsed</div>';
        return;
    }
    container.innerHTML = tables.map((t, i) => `
        <div class="table-item">
            <div class="table-item-header" onclick="toggleTableColumns(this)">
                <span>
                    <span class="table-name">${escapeHtml(t.tableName)}</span>
                    ${t.tableComment ? `<span class="table-comment"> &mdash; ${escapeHtml(t.tableComment)}</span>` : ''}
                </span>
                <span style="font-size:12px;color:var(--text-secondary);">${t.columns ? t.columns.length : 0} columns &#9660;</span>
            </div>
            <div class="table-columns">
                ${(t.columns || []).map(c => `
                    <div class="column-row">
                        <span class="col-name">${escapeHtml(c.columnName)}</span>
                        <span class="col-type">${escapeHtml(c.dataType)}</span>
                        <span class="col-java">${escapeHtml(c.attrType)}</span>
                        <span class="col-comment">${escapeHtml(c.columnComment || '')}</span>
                    </div>
                `).join('')}
            </div>
        </div>
    `).join('');
}

function toggleTableColumns(header) {
    const columns = header.nextElementSibling;
    columns.classList.toggle('open');
}

// ===== Generate Code =====
async function generateCode() {
    if (!parsedSql) return showToast('No SQL to generate from', 'error');

    const author = document.getElementById('author').value || 'sue';
    const packageName = document.getElementById('packageName').value || 'com.example';

    const codeTypes = [];
    document.querySelectorAll('#codeTypes .checkbox-item.checked').forEach(el => {
        codeTypes.push(el.dataset.value);
    });

    const btn = document.getElementById('btnGenerate');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Generating...';

    try {
        const res = await fetch('/api/gen/generate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ author, packageName, createSql: parsedSql, codeTypes })
        });

        if (!res.ok) {
            const err = await res.json();
            throw new Error(err.message || 'Generation failed');
        }

        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'code-generator.zip';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        showToast('Code generated successfully!', 'success');
    } catch (e) {
        showToast('Generation failed: ' + e.message, 'error');
    } finally {
        btn.disabled = false;
        btn.innerHTML = 'Generate & Download ZIP';
    }
}

// ===== Clear =====
function clearAll() {
    parsedSql = '';
    parsedTables = [];
    document.getElementById('sqlEditor').value = '';
    document.getElementById('fileInput').value = '';
    document.getElementById('fileInfo').style.display = 'none';
    document.getElementById('tablePreview').innerHTML = '<div class="empty-state">Parse SQL to see table structure</div>';
    document.getElementById('tableCount').textContent = '';
    document.getElementById('btnGenerate').disabled = true;
}

// ===== Toast =====
function showToast(message, type) {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    toast.textContent = message;
    container.appendChild(toast);
    setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.3s';
        setTimeout(() => toast.remove(), 300);
    }, 3000);
}

// ===== Utils =====
function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// ===== Keyboard shortcut: Ctrl+Enter to parse =====
document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault();
        parseSql();
    }
});
</script>
