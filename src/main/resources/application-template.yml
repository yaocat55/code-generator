server:
  port: 7000

spring:
  application:
    name: code-generator
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    encoding: UTF-8
    mode: HTML
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

  ai:
    openai:
      api-key: ${AI_API_KEY:sk-your-api-key-here}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-v4-flash
          temperature: 0.3

logging:
  level:
    cn.net.yao: DEBUG
